server.port=8081

# ==================== 数据源（本地 MySQL 8.0） ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/doupo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ==================== MyBatis-Plus ====================
# 控制台打印 SQL，方便联调；上线可关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 开启下划线列名到驼峰属性的映射（created_at -> createdAt）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键使用数据库自增
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
