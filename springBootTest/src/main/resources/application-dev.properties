# ==================== 服务监听 ====================
# 后端对外地址：http://192.168.137.1:8081（本机局域网 IP）
# 监听所有网卡，保证 localhost 与 192.168.137.1 都能访问；
# 不要写死 server.address=192.168.137.1，否则本机 localhost 将无法访问。
server.address=0.0.0.0
server.port=8081

# ==================== 数据源（本机 MySQL 8.0） ====================
# 注意：MySQL 与后端在同一台机器，这里必须保持 localhost:3306，不要改成局域网 IP。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/doupo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ==================== MyBatis-Plus ====================
# 控制台打印 SQL，方便联调；上线可关闭
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 开启下划线列名到驼峰属性的映射（created_at -> createdAt）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键使用数据库自增
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
